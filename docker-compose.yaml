services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host-only: the database is reachable from this machine, not the network.
      - "127.0.0.1:${POSTGRES_PORT_OUTER}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    env_file:
      - .env
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT_INNER}/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT_INNER: ${POSTGRES_PORT_INNER}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - image_upload:/app/images
    command: >
      sh -c "
        alembic upgrade head &&
        (python scripts/seed_tags.py || echo 'Tag seeding failed, continuing anyway') &&
        (python scripts/seed_profiles.py --target 500 || echo 'Profile seeding failed, continuing anyway') &&
        (python scripts/seed_armenia_profiles.py --count 50 || echo 'Armenia profile seeding failed, continuing anyway') &&
        uvicorn application.main:app --host ${BACKEND_HOST} --port 8000 --ws-max-size 32768 --reload
      "

    networks:
      - app-network
    restart: unless-stopped

  minio:
    # Official minio/minio images were removed from Docker Hub/Quay (source-only since 2025);
    # pgsty/minio is a maintained community fork with pinnable release tags.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    # Only the two variables below are passed (not the whole .env).
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      # Host-only: the API reaches MinIO over app-network; nothing else should.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: react_frontend
    # Only what the dev server and the bundle read: the dev server has no use for the .env secrets.
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      FAST_REFRESH: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped

volumes:
  image_upload:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge