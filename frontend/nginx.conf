# Production image (Dockerfile). __API_ORIGIN__ / __WS_ORIGIN__ are replaced at build time from
# REACT_APP_API_URL / REACT_APP_WS_URL, the same values baked into the bundle.
# The build sets INLINE_RUNTIME_CHUNK=false (package.json), so no inline <script> exists and
# script-src needs no 'unsafe-inline'. style-src keeps 'unsafe-inline' for react-hot-toast's
# injected <style> and Leaflet; React style props use the CSSOM and need nothing.
# Note: nginx drops server-level add_header in a location that has its own add_header, so the
# headers are repeated in each location.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: __API_ORIGIN__ https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' __API_ORIGIN__ __WS_ORIGIN__; media-src 'self' blob: mediastream:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # OpenStreetMap's tile policy needs a Referer, so not no-referrer.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
